name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for the whole workflow: this job only checks out
# code, typechecks, and runs tests — it never needs to write anything.
permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # vlt isn't corepack-shimmed (unlike npm/yarn/pnpm), so it's
      # installed explicitly rather than via `corepack enable`.
      - run: npm install -g vlt
      - run: vlt install
      - run: vlt run typecheck
      - run: vlt run test
